
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的名字 - 主页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 { font-size: 2.2em; margin-bottom: 0.2em; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 1.5em; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .paper { margin-bottom: 0.8em; }
        .paper-title { font-weight: bold; }
        .paper-authors { color: #555; }
        .paper-venue { font-style: italic; color: #777; }
        .paper-links { font-size: 0.9em; }
        .bio { margin: 1.5em 0; }
        .footer { margin-top: 2em; border-top: 1px solid #eee; padding-top: 1em; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <!-- 个人信息 -->
    <h1>你的名字</h1>
    <p><strong>研究方向：</strong> 机器学习系统 / 高性能计算 / 其他</p>
    <p>
        📧 <a href="mailto:your.email@example.com">your.email@example.com</a> &nbsp;|&nbsp;
        🏠 <a href="https://github.com/mlsys-research-jedy">GitHub</a> &nbsp;|&nbsp;
        🧑‍🎓 <a href="#">Google Scholar</a>
    </p>

    <!-- 个人简介 -->
    <div class="bio">
        <p>我是 [你的全名]，[某大学/机构] 的 [职位，如博士生/研究员]。我的研究兴趣包括 [领域1]、[领域2] 等。</p>
    </div>

    <!-- 发表的论文 -->
    <h2>📄 发表论文</h2>

    <div class="paper">
        <span class="paper-title">论文标题1</span><br>
        <span class="paper-authors">作者1, 作者2, 你, 作者4</span><br>
        <span class="paper-venue">会议/期刊名称, 年份</span><br>
        <span class="paper-links">
            [<a href="#">PDF</a>] [<a href="#">DOI</a>] [<a href="#">代码</a>]
        </span>
    </div>

    <div class="paper">
        <span class="paper-title">论文标题2</span><br>
        <span class="paper-authors">你, 作者A, 作者B</span><br>
        <span class="paper-venue">另一会议/期刊, 年份</span><br>
        <span class="paper-links">
            [<a href="#">PDF</a>] [<a href="#">项目页</a>]
        </span>
    </div>

    <!-- 可以继续添加更多论文 -->

    <div class="footer">
        © 2026 你的名字 · 基于纯 HTML 构建
    </div>
</body>
</html>
